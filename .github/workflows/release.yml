name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sdd-linux-x64
            bin: sdd
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: sdd-macos-x64
            bin: sdd
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: sdd-macos-arm64
            bin: sdd
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sdd-windows-x64.exe
            bin: sdd.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --package sdd-cli --target ${{ matrix.target }}
      - name: Rename binary for release
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print
          gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
          if ! gh release create "$GITHUB_REF_NAME" dist/*/* --generate-notes > /tmp/release.err 2>&1; then
            echo "::error::gh release create 失败"
            tail -30 /tmp/release.err | sed 's/^/::error::/'
            exit 1
          fi
