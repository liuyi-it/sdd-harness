name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sdd-linux-x64
            bin: sdd
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: sdd-macos-x64
            bin: sdd
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: sdd-macos-arm64
            bin: sdd
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sdd-windows-x64.exe
            bin: sdd.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --package sdd-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
